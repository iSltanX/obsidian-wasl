name: CI

# الفحوص تجري محليًا (npm run check وخطّاف pre-push). هذا السير يدوي فقط،
# لأن Actions لا تعمل على المستودع الخاص بسبب الفوترة.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # مثبّت على 7.0.0 لأن 7.1.0 صدر يوم إنشاء المستودع
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
